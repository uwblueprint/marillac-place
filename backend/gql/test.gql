        icon
      }
    }
  }
}

mutation CreateNote($message: String!) {
  createNote(message: $message) {
    nid
    message
    date
  }
}

mutation DeleteNote($nid: Int!) {
  deleteNote(nid: $nid) {
    nid
    message
  }
}

mutation CreateReportRecipient(
