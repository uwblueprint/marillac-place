# GraphQL operations for Marillac Place backend
# Copy / paste queries and mutations in this file and supply variable values as needed
# Date, DateTime, Time types expect ISO-8601 strings (e.g. "2025-01-01T12:00:00Z").

query GetNotes {
  getNotes {
    nid
    message
    date
  }
}

query GetReportRecipients {
  getReportRecipients {
    email
    weekly
    monthly
  }
}

query GetAnnouncementsFromToday {
  getAnnouncementsFromToday {
    aid
    date
    message
    priority
    ReceivedAnnouncement {
      pid
      participant {
        room
      }
    }
  }
}

query GetAnnouncementsSentToParticipants($pids: [Int!]!) {
  getAnnouncementsSentToParticipants(pids: $pids) {
    aid
    date
    message
    priority
    ReceivedAnnouncement {
      pid
    }
  }
}

query GetReceivedAnnouncements(
  $pid: Int!
  $unread: Boolean
  $pinned: Boolean
  $important: Boolean
) {
  getReceivedAnnouncements(
    pid: $pid
    unread: $unread
    pinned: $pinned
    important: $important
  ) {
    aid
    pid
    read
    pinned
    announcement {
      aid
      message
      priority
      date
    }
  }
}

query GetEarningGoal($pid: Int!) {
  getEarningGoal(pid: $pid) {
    pid
    action
    value
    date
  }
}

query GetTasksByType($type: TaskType!) {
  getTasksByType(type: $type) {
    tid
    name
    type
    value
    penalty
    comment
    day_preference
    days
    time_preference
    start_time
    end_time
  }
}

query GetCustomBadges {
  getCustomBadges {
    cid
    name
    icon
    description
  }
}

query GetWeeklyEarnings($pid: Int!) {
  getWeeklyEarnings(pid: $pid) {
    SUNDAY
    MONDAY
    TUESDAY
    WEDNESDAY
    THURSDAY
    FRIDAY
    SATURDAY
  }
}

query GetParticipantByPid($pid: Int!) {
  getParticipantByPid(pid: $pid) {
    pid
    room
    arrival
    departure
    balance
    total_earnings
  }
}

query GetCurrentParticipants {
