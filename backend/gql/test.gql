mutation CreateTask(
  $type: TaskType!
  $name: String!
  $value: Int!
  $penalty: Int!
  $dayPreference: DayPreference!
  $days: [DayOfWeek!]!
  $timePreference: TimePreference!
  $startTime: Date
  $endTime: Date
  $comment: String
) {
  createTask(
    type: $type
    name: $name
    value: $value
    penalty: $penalty
    day_preference: $dayPreference
    days: $days
    time_preference: $timePreference
    start_time: $startTime
    end_time: $endTime
    comment: $comment
  ) {
    tid
    name
    type
    value
    penalty
    day_preference
    days
    time_preference
    start_time
    end_time
    comment
  }
}

mutation UpdateTask(
  $tid: Int!
  $type: TaskType
  $name: String
  $value: Int
  $penalty: Int
  $dayPreference: DayPreference
  $days: [DayOfWeek!]
  $timePreference: TimePreference
  $startTime: Date
  $endTime: Date
  $comment: String
) {
  updateTask(
    tid: $tid
    type: $type
    name: $name
    value: $value
    penalty: $penalty
    day_preference: $dayPreference
    days: $days
    time_preference: $timePreference
    start_time: $startTime
    end_time: $endTime
    comment: $comment
  ) {
    tid
    name
    type
    value
    penalty
    day_preference
    days
    time_preference
    start_time
    end_time
    comment
  }
}

mutation DeleteTask($tid: Int!) {
