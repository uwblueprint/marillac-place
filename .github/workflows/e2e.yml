name: End-to-End Tests

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

jobs:
  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.18.2"
          cache: "yarn"
          cache-dependency-path: |
            backend/yarn.lock
            frontend/yarn.lock

      - name: Install E2E dependencies
        working-directory: ./e2e
        run: yarn install --prefer-offline

      - name: Install Playwright browser
        working-directory: ./e2e
        run: yarn install:browsers

      - name: Run dockerized E2E tests
        working-directory: ./e2e
        env:
          CI: true
          E2E_BASE_URL: http://localhost:3000
          E2E_BACKEND_URL: http://localhost:5000/graphql
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mp
          E2E_PARTICIPANT_PID: "1"
          E2E_PARTICIPANT_PASSWORD: test123
          E2E_ADMIN_PASSWORD: abc123
          E2E_RELIEF_PASSWORD: test123
        run: yarn test:docker

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

      - name: Upload raw test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results
          if-no-files-found: ignore
